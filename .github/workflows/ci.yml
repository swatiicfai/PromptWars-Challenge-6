name: AuraAir CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Repository Size (< 10 MB Constraint)
        run: |
          REPO_SIZE_KB=$(du -sk . | cut -f1)
          echo "Current Repository Size: ${REPO_SIZE_KB} KB"
          if [ $REPO_SIZE_KB -gt 10240 ]; then
            echo "Error: Repository exceeds 10 MB limit!"
            exit 1
          fi
          echo "Repository size check passed: Clean & lightweight (< 10 MB)"

      - name: Verify Single Branch Policy
        run: |
          BRANCH_COUNT=$(git branch -r | grep -v '\->' | wc -l)
          echo "Remote branches found: ${BRANCH_COUNT}"
          if [ $BRANCH_COUNT -gt 1 ]; then
            echo "Warning: Multiple remote branches detected."
          fi
          echo "Branch policy check complete."

      - name: Syntax Check All JavaScript Modules
        run: |
          node --check js/aqi-engine.js
          node --check js/impact-calculator.js
          node --check js/gemini.js
          node --check js/app.js
          node --check tests/run-tests.js
          echo "All JavaScript modules passed syntax check ✅"

      - name: Validate HTML Structure
        run: |
          grep -c 'id=' index.html && echo "HTML IDs found ✅"
          grep -q 'Content-Security-Policy' index.html && echo "CSP meta tag present ✅"
          grep -q 'role="tablist"' index.html && echo "ARIA tablist present ✅"
          grep -q 'lang="en"' index.html && echo "HTML lang attribute present ✅"

      - name: Verify Zero External Runtime Dependencies
        run: |
          if grep -rnE 'https?://(cdn\.|fonts\.googleapis)' index.html js/ css/; then
            echo "ERROR: External CDN or font dependency found!"
            exit 1
          fi
          echo "Zero external runtime dependencies confirmed"

      - name: Execute Automated Verification Suite
        run: |
          OUTPUT=$(node tests/run-tests.js 2>&1)
          echo "$OUTPUT"
          # Assert 100% pass rate — fail CI if any test fails
          if echo "$OUTPUT" | grep -q "Tests Failed:     0"; then
            echo "✅ All tests passed — 100% pass rate confirmed"
          else
            echo "❌ Test failures detected — aborting CI"
            exit 1
          fi
          # Assert minimum test count to prevent test regression
          PASSED=$(echo "$OUTPUT" | grep -oP 'Tests Passed:\s+\K[0-9]+')
          echo "Tests passed count: $PASSED"
          if [ "${PASSED:-0}" -lt 220 ]; then
            echo "❌ Test suite regression: fewer than 220 tests passing"
            exit 1
          fi
          echo "✅ Test suite integrity verified: $PASSED tests passing"

      - name: Verify Service Worker Exists
        run: |
          test -f sw.js && echo "✅ Service Worker sw.js present"
          test -f manifest.json && echo "✅ PWA manifest.json present"

      - name: Verify PWA Manifest Linked in HTML
        run: |
          grep -q 'rel="manifest"' index.html && echo "✅ manifest.json linked in index.html"
          grep -q 'serviceWorker' index.html && echo "✅ Service Worker registered in index.html"
